[project]
name = "gajufreight-api"
version = "0.1.0"
description = "GajuFreight API: shipment booking, GRIDS payload building and evidence ingest"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
