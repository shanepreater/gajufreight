[project]
name = "gajufreight-chain"
version = "0.1.0"
description = "Typed client for the Gajumaru node HTTP API, shared by GajuFreight services"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
    "httpx2>=2.13.1",
    "pydantic>=2.13.5",
]

[project.scripts]
gajufreight-fork-watch = "gajufreight_chain.tools.fork_watch:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"
