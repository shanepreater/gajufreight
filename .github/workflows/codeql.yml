# Security analysis (CodeQL) for Python, JavaScript and the workflows themselves.
# Runs only when code lands on main plus weekly, not on every PR, to save
# Actions minutes. Results appear under Security → Code scanning.

name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
      - '.github/workflows/**'
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: python, javascript-typescript, actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
