<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" aria-label="GajuFreight Logo Mark">
  <defs>
    <!-- Gaju Palette Gradients -->
    <linearGradient id="gajuCharcoal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="freightOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- LOGO MARK: Blown-Up Standalone Icon (1:1 Aspect Ratio)        -->
  <!-- ============================================================ -->
  <g id="gaju-ki-ship-icon-large" transform="translate(25, 20) scale(1.35)">
    <!-- Container Stacks on Deck (Logistics / Freight Accent) -->
    <rect x="22" y="22" width="11" height="14" rx="1.5" fill="url(#freightOrange)" opacity="0.9" />
    <rect x="35" y="18" width="11" height="18" rx="1.5" fill="url(#gajuCharcoal)" />
    <rect x="54" y="18" width="11" height="18" rx="1.5" fill="url(#gajuCharcoal)" />
    <rect x="67" y="22" width="11" height="14" rx="1.5" fill="url(#freightOrange)" opacity="0.9" />

    <!-- Ki Kanji (木) Main Vertical Trunk / Mast -->
    <rect x="44" y="6" width="12" height="90" rx="3" fill="url(#gajuCharcoal)" />

    <!-- Ki Kanji (木) Horizontal Beam / Main Ship Deck -->
    <rect x="6" y="38" width="88" height="12" rx="3" fill="url(#gajuCharcoal)" />

    <!-- Ki Kanji (木) Left Lower Branch (Port Stern Hull Line) -->
    <path d="M 44 48 C 30 58 18 70 8 84 C 6 86.8 9.5 90 13 88 C 24 82 35 72 44 60 Z" fill="url(#gajuCharcoal)" />

    <!-- Ki Kanji (木) Right Lower Branch (Starboard Bow Line in Freight Orange) -->
    <path d="M 56 48 C 70 58 82 70 92 84 C 94 86.8 90.5 90 87 88 C 76 82 65 72 56 60 Z" fill="url(#freightOrange)" />

    <!-- Hull Base Splice (Connecting the Ki Branches into a Ship Hull) -->
    <path d="M 18 80 L 82 80 L 76 88 L 24 88 Z" fill="url(#gajuCharcoal)" opacity="0.85" />

    <!-- Ocean Transit Baseline (Speed & Directional Flow) -->
    <path d="M 4 98 L 78 98 C 88 98 96 92 102 84 L 108 76" stroke="url(#freightOrange)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 16 105 L 68 105" stroke="url(#gajuCharcoal)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.35" />
  </g>
</svg>
